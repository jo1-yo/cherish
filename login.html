<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — CHERISH</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-head"></div>

<div class="wrap auth-wrap">
  <div class="center" style="margin-bottom:30px">
    <p class="eyebrow">Your account</p>
    <h1 style="font-size:2.6rem;margin-top:10px">Welcome</h1>
    <p class="muted" style="font-size:.9rem;margin-top:8px">Sign in to track orders, save favorites and note ideas for custom pieces.</p>
  </div>
  <div class="auth-tabs">
    <button type="button" class="auth-tab active" data-tab="login">Sign In</button>
    <button type="button" class="auth-tab" data-tab="register">Sign Up</button>
  </div>

  <form id="login-form">
    <div class="field"><label>Email</label><input type="email" id="li-email" required placeholder="you@email.com"></div>
    <div class="field"><label>Password</label><input type="password" id="li-pass" required placeholder="••••••••"></div>
    <button class="btn block" type="submit">Sign In</button>
    <p class="form-note">No account yet? <a href="#" onclick="switchTab('register');return false;">Sign up</a></p>
  </form>

  <!-- Step 1: enter email (+ name), request a verification code -->
  <form id="register-form" style="display:none">
    <div class="field"><label>Name</label><input type="text" id="rg-name" placeholder="First name"></div>
    <div class="field"><label>Email</label><input type="email" id="rg-email" required placeholder="you@email.com"></div>
    <p class="muted" style="font-size:.78rem;margin:-10px 0 20px">We'll email a 6-digit code to verify it's really you.</p>
    <button class="btn block gold" type="submit">Send Verification Code</button>
    <p class="form-note">Already with us? <a href="#" onclick="switchTab('login');return false;">Sign in</a></p>
  </form>

  <!-- Step 2: enter the code that was emailed -->
  <form id="verify-form" style="display:none">
    <p class="muted" style="font-size:.84rem;margin-bottom:20px">Enter the 6-digit code sent to <b id="verify-email-label"></b>.</p>
    <div class="field"><label>Verification Code</label><input type="text" id="rg-code" inputmode="numeric" maxlength="6" placeholder="000000" required></div>
    <button class="btn block gold" type="submit">Verify &amp; Create Account</button>
    <p class="form-note"><a href="#" onclick="backToRegister();return false;">Use a different email</a> · <a href="#" onclick="resendCode();return false;">Resend code</a></p>
  </form>
</div>

<div id="site-foot"></div>
<script src="js/app.js"></script>
<script>
  renderHeader('login'); renderFooter();
  const next=new URLSearchParams(location.search).get('next')||'account.html';

  window.switchTab=function(t){
    document.querySelectorAll('.auth-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
    document.getElementById('login-form').style.display   = t==='login'?'block':'none';
    document.getElementById('register-form').style.display= t==='register'?'block':'none';
    document.getElementById('verify-form').style.display  = 'none';
  };
  document.querySelectorAll('.auth-tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  // allow ?tab=register to open directly on the register form
  if((new URLSearchParams(location.search).get('tab'))==='register') switchTab('register');

  document.getElementById('login-form').onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById('li-email').value.trim();
    const btn=e.target.querySelector('button[type=submit]');
    btn.disabled=true; btn.textContent='Signing in…';
    try{
      const {user}=await Api.login(email);   // backend records every login
      Auth.login(user.email,user.name);
      toast('Welcome back'); setTimeout(()=>location.href=next,600);
    }catch(err){
      if(err.message.includes('fetch')){
        toast('Backend not running — start it with: python3 backend/server.py');
      }else if(/sign up/i.test(err.message)){
        toast(err.message);
        document.getElementById('rg-email').value=email;
        setTimeout(()=>switchTab('register'),700);
      }else{ toast(err.message); }
    }finally{ btn.disabled=false; btn.textContent='Sign In'; }
  };

  window.backToRegister=()=>{
    document.getElementById('verify-form').style.display='none';
    document.getElementById('register-form').style.display='block';
  };
  window.resendCode=async()=>{
    try{ await Api.requestCode(pendingEmail); toast('New code sent — check your email'); }
    catch(err){ toast(err.message); }
  };

  let pendingEmail='', pendingName='';
  document.getElementById('register-form').onsubmit=async e=>{
    e.preventDefault();
    pendingEmail=document.getElementById('rg-email').value.trim();
    pendingName=document.getElementById('rg-name').value.trim();
    const btn=e.target.querySelector('button[type=submit]');
    btn.disabled=true; btn.textContent='Sending…';
    try{
      await Api.requestCode(pendingEmail);
      document.getElementById('verify-email-label').textContent=pendingEmail;
      document.getElementById('register-form').style.display='none';
      document.getElementById('verify-form').style.display='block';
      document.getElementById('rg-code').focus();
      toast('Code sent — check your email');
    }catch(err){
      toast(err.message.includes('fetch')
        ? 'Backend not running — start it with: python3 backend/server.py'
        : err.message);
    }finally{ btn.disabled=false; btn.textContent='Send Verification Code'; }
  };

  document.getElementById('verify-form').onsubmit=async e=>{
    e.preventDefault();
    const code=document.getElementById('rg-code').value.trim();
    const btn=e.target.querySelector('button[type=submit]');
    btn.disabled=true; btn.textContent='Verifying…';
    try{
      const {user}=await Api.verifyCode(pendingEmail,code,pendingName);
      Auth.login(user.email,user.name);
      toast('Account created'); setTimeout(()=>location.href=next,600);
    }catch(err){ toast(err.message); }
    finally{ btn.disabled=false; btn.textContent='Verify & Create Account'; }
  };
</script>
</body>
</html>
